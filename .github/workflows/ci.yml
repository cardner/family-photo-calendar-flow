
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-commits:
    name: Validate Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.1.0

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate commit messages
        run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    name: Test and Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: |
          echo "Running ESLint to check for errors and warnings..."
          # Run ESLint and capture output
          if yarn eslint . --format=json > eslint-results.json 2>&1; then
            echo "✅ ESLint passed with no errors"
          else
            # Check if there are actual errors (not just warnings)
            ERROR_COUNT=$(cat eslint-results.json | jq '[.[] | select(.errorCount > 0)] | length' 2>/dev/null || echo "0")
            WARNING_COUNT=$(cat eslint-results.json | jq '[.[] | select(.warningCount > 0)] | length' 2>/dev/null || echo "0")
            
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "❌ ESLint found errors - failing build"
              yarn eslint . # Show the actual output
              exit 1
            elif [ "$WARNING_COUNT" -gt 0 ]; then
              echo "⚠️ ESLint found warnings but no errors - continuing build"
              yarn eslint . # Show the warnings
            else
              echo "❌ ESLint failed for unknown reasons"
              yarn eslint . # Show the output
              exit 1
            fi
          fi

      - name: Run tests
        run: yarn vitest run

      - name: Build project
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.1.0

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run security audit (high and critical only)
        run: |
          echo "Running security audit for high and critical vulnerabilities..."
          AUDIT_RESULT=$(yarn npm audit --all --recursive --json || echo '{}')

          HIGH_CRITICAL_COUNT=$(echo "$AUDIT_RESULT" | jq -r '[.advisories // {} | to_entries[].value | select(.severity == "high" or .severity == "critical")] | length' 2>/dev/null || echo "0")

          if [ "$HIGH_CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $HIGH_CRITICAL_COUNT high/critical vulnerabilities"
            yarn npm audit --all --recursive
            exit 1
          else
            echo "✅ No high or critical vulnerabilities found"
          fi

      - name: Report moderate vulnerabilities (non-blocking)
        run: |
          echo "Checking for moderate vulnerabilities (informational only)..."
          yarn npm audit --all --recursive || echo "⚠️ Found vulnerabilities - consider running 'yarn npm audit' locally"
