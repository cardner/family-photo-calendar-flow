
name: 'Setup Dependencies and Security Check'
description: 'Install dependencies, fix vulnerabilities, and run security audit'
inputs:
  skip_tests:
    description: 'Skip tests during setup'
    required: false
    default: 'false'
outputs:
  security_passed:
    description: 'Whether security check passed'
    value: ${{ steps.security-check.outputs.passed }}
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.1.0

    - name: Enable Corepack (Yarn 4)
      shell: bash
      run: corepack enable

    - name: Cache Yarn dependencies
      uses: actions/cache@v4
      with:
        path: .yarn/cache
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: ${{ runner.os }}-yarn-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Run tests
      if: ${{ inputs.skip_tests == 'false' }}
      shell: bash
      run: yarn vitest run

    - name: Security check (high/critical only)
      id: security-check
      shell: bash
      run: |
        AUDIT_RESULT=$(yarn npm audit --all --recursive --json || echo '{}')
        HIGH_CRITICAL_COUNT=$(echo "$AUDIT_RESULT" | jq -r '[.advisories // {} | to_entries[].value | select(.severity == "high" or .severity == "critical")] | length' 2>/dev/null || echo "0")
        
        if [ "$HIGH_CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ Cannot release with high/critical vulnerabilities"
          yarn npm audit --all --recursive
          echo "passed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "passed=true" >> $GITHUB_OUTPUT

    - name: Build project
      shell: bash
      run: yarn build
